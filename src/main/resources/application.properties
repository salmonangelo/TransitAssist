spring.application.name=transit-assist
server.port=8080

# ---------- MySQL ----------
# Change DB_USERNAME / DB_PASSWORD via environment variables, or edit the defaults below.
spring.datasource.url=jdbc:mysql://localhost:3306/transitassist_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Business settings ----------
# Length of one assistance slot. Two assignments for the same helper overlap
# when their start times are closer than this many minutes.
transitassist.assistance-duration-minutes=60

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
