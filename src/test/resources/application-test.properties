# Used only by "mvn test": in-memory H2 (MySQL compatibility mode) so no MySQL server is needed.
spring.datasource.url=jdbc:h2:mem:transitassist_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
